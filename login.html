<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Administrasi SD</title>
  <link rel="stylesheet" href="css/design-system.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem; }
    .login-card { background: white; width: 100%; max-width: 400px; padding: 2rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); box-shadow: var(--shadow-card); }
    .form-input { width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); margin-top: 0.3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2 style="color: var(--color-navy); margin-bottom: 0.5rem; text-align: center;">Masuk Aplikasi</h2>
      <p style="font-size: 0.85rem; color: var(--color-text-muted); text-align: center; margin-bottom: 1.5rem;">Masukkan akun Guru / Administrator</p>
      
      <form id="loginForm" onsubmit="handleUserLogin(event)">
        <label style="font-size: 0.85rem; font-weight: 600;">Email Sekolah</label>
        <input type="email" id="loginEmail" class="form-input" required placeholder="guru@sd.sch.id">
        
        <label style="font-size: 0.85rem; font-weight: 600;">Kata Sandi</label>
        <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••">
        
        <button type="submit" style="width: 100%; padding: 0.85rem; background: var(--color-navy-light); color: white; border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer;">Masuk Sistem</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    async function handleUserLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Gagal login: ' + error.message);
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
